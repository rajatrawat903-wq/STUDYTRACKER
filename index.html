<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command12 — Study & Progress Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F1A; --surface:#121826; --surface2:#182036; --border:#232C42;
  --ink:#E7EAF3; --ink-dim:#8892AB; --ink-faint:#5A6480;
  --accent:#7C6CF6; --accent-dim:#7C6CF62a; --amber:#F5A623; --amber-dim:#F5A6232a;
  --green:#33C481; --green-dim:#33C4812a; --red:#F0555A; --red-dim:#F0555A2a;
  --cyan:#3FC6E0;
  --radius:14px; --radius-sm:9px;
  --shadow: 0 8px 30px rgba(0,0,0,0.35);
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:#F5F4F0; --surface:#FFFFFF; --surface2:#FBFAF7; --border:#E4E1D8;
  --ink:#1B1D22; --ink-dim:#6B6D76; --ink-faint:#9A9CA5;
  --accent:#6551E8; --accent-dim:#6551E81a; --amber:#C97A1B; --amber-dim:#C97A1b1a;
  --green:#1C9A63; --green-dim:#1C9A631a; --red:#D6444A; --red-dim:#D6444A1a;
  --cyan:#0E90AC;
  --shadow: 0 8px 24px rgba(30,25,15,0.08);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; background:var(--surface2); border:1px solid var(--border); color:var(--ink); border-radius:8px; padding:8px 10px; font-size:13px; outline:none; width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
.app{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
.sidebar{background:var(--surface); border-right:1px solid var(--border); padding:22px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh; overflow-y:auto;}
.brand{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.02em; padding:4px 10px 4px; display:flex; align-items:center; gap:8px;}
.brand .dot{width:9px;height:9px;border-radius:3px;background:var(--accent); box-shadow:0 0 12px var(--accent);}
.brand small{display:block; font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); font-weight:500; letter-spacing:0.04em;}
.navgroup{margin-top:18px; margin-bottom:2px; font-size:10px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-faint); padding:0 10px; font-weight:600;}
.navitem{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; color:var(--ink-dim); font-size:13.5px; font-weight:500; cursor:pointer; transition:.12s;}
.navitem:hover{background:var(--surface2); color:var(--ink);}
.navitem.active{background:var(--accent-dim); color:var(--accent);}
.navitem svg{width:16px;height:16px; flex-shrink:0;}
.main{padding:26px 34px 60px; max-width:1360px;}
.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px;}
.pagetitle{font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-0.02em;}
.pagesub{color:var(--ink-dim); font-size:13px; margin-top:2px;}
.topactions{display:flex; gap:10px; align-items:center;}
.iconbtn{width:36px;height:36px;border-radius:9px;background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--ink-dim);}
.iconbtn:hover{color:var(--ink); border-color:var(--accent);}
.btn{background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:9px; font-weight:600; font-size:13px; display:inline-flex; align-items:center; gap:6px;}
.btn:hover{filter:brightness(1.08);}
.btn.secondary{background:var(--surface2); color:var(--ink); border:1px solid var(--border);}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent-dim);}
.btn.danger{background:var(--red-dim); color:var(--red);}
.grid{display:grid; gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);} .g3{grid-template-columns:repeat(3,1fr);} .g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:repeat(2,1fr);}}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;}

/* ===== Premium subject / syllabus UI ===== */
.subject-card{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--surface),var(--surface2));border-radius:18px;padding:20px;min-height:210px;box-shadow:0 8px 24px rgba(0,0,0,.08);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;}
.subject-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 32px rgba(0,0,0,.14);}
.subject-card .subject-accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
.subject-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.subject-name{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.02em;}
.subject-menu{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);cursor:pointer;}
.subject-menu:hover{color:var(--ink);border-color:var(--accent);}
.subject-open{margin-top:16px;padding-top:13px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;color:var(--ink-dim);font-size:12px;font-weight:600;}
.subject-picker-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;margin-bottom:12px;}
.subject-picker-group{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface);}
.picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:7px;}
.picker-item{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--surface2);font-size:12px;font-weight:600;transition:.12s;}
.picker-item:hover{border-color:var(--accent);transform:translateY(-1px);}
.picker-item input{accent-color:var(--accent);width:15px;height:15px;}
.chapter-card{background:linear-gradient(145deg,var(--surface),var(--surface2));border-radius:16px;transition:transform .16s,border-color .16s,box-shadow .16s;}
.chapter-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 24px rgba(0,0,0,.1);}
@media(max-width:700px){.main{padding:18px 14px 50px}.g3,.g2{grid-template-columns:1fr}.topbar{align-items:flex-start;gap:12px;flex-direction:column}.topactions{width:100%;flex-wrap:wrap}.picker-grid{grid-template-columns:1fr 1fr;}}
.card.pad-lg{padding:22px;}
.stat-card{display:flex; flex-direction:column; gap:6px;}
.stat-label{font-size:11.5px; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.04em;}
.stat-value{font-family:var(--font-mono); font-size:26px; font-weight:700; letter-spacing:-0.01em;}
.stat-delta{font-size:11.5px; color:var(--ink-faint);}
.section-title{font-family:var(--font-display); font-size:16px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; justify-content:space-between;}
.ring-wrap{display:flex; flex-direction:column; align-items:center; gap:8px;}
.ring-label{font-size:12px; color:var(--ink-dim); font-weight:600; text-align:center;}
.ring-value{font-family:var(--font-mono); font-weight:700; font-size:20px;}
.pill{display:inline-flex; align-items:center; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.pill.blue{background:var(--accent-dim); color:var(--accent);}
.pill.green{background:var(--green-dim); color:var(--green);}
.pill.amber{background:var(--amber-dim); color:var(--amber);}
.pill.red{background:var(--red-dim); color:var(--red);}
.pill.gray{background:var(--surface2); color:var(--ink-dim); border:1px solid var(--border);}
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border);}
td{padding:10px 10px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.rowhover:hover{background:var(--surface2);}
.progress-bar{height:7px; background:var(--surface2); border-radius:6px; overflow:hidden; border:1px solid var(--border);}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--cyan)); border-radius:6px; transition:.3s;}
.tabs{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px; overflow-x:auto;}
.tab{padding:9px 14px; font-size:13px; font-weight:600; color:var(--ink-dim); border-bottom:2px solid transparent; white-space:nowrap; cursor:pointer;}
.tab.active{color:var(--accent); border-color:var(--accent);}
.modal-bg{position:fixed; inset:0; background:rgba(5,7,12,0.6); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
[data-theme="light"] .modal-bg{background:rgba(30,25,15,0.25);}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:24px; width:520px; max-width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow);}
.modal h3{font-family:var(--font-display); font-size:18px; margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11.5px; color:var(--ink-dim); font-weight:600; margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
.fieldrow{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.checklist-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px;}
.chk-item{display:flex; align-items:center; gap:8px; font-size:12.5px; padding:6px 8px; border-radius:7px;}
.chk-item:hover{background:var(--surface2);}
.chk-item input{width:15px;height:15px;}
.empty{text-align:center; padding:40px 20px; color:var(--ink-faint);}
.empty svg{width:36px;height:36px; margin-bottom:10px; opacity:.5;}
.badge-row{display:flex; gap:10px; flex-wrap:wrap;}
.badge{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px; border-radius:12px; background:var(--surface2); border:1px solid var(--border); width:104px; text-align:center;}
.badge.earned{border-color:var(--amber); background:var(--amber-dim);}
.badge .bicon{font-size:22px;}
.badge .btitle{font-size:10.5px; font-weight:600; color:var(--ink-dim);}
.badge.earned .btitle{color:var(--amber);}
.searchbox{display:flex; align-items:center; gap:8px; background:var(--surface2); border:1px solid var(--border); border-radius:9px; padding:7px 12px; width:260px;}
.searchbox input{background:transparent; border:none; padding:0;}
.searchbox svg{width:15px;height:15px; color:var(--ink-faint); flex-shrink:0;}
.heat-cell{width:13px;height:13px;border-radius:3px; background:var(--surface2);}
.filterbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filterbar select{width:auto; min-width:120px;}
.smallmuted{color:var(--ink-faint); font-size:12px;}
.subj-dot{width:9px;height:9px;border-radius:3px; display:inline-block; margin-right:6px;}
.icon-action{background:none;border:none;color:var(--ink-faint); padding:4px; border-radius:6px;}
.icon-action:hover{color:var(--accent); background:var(--surface2);}
.hidden{display:none !important;}
.toast{position:fixed; bottom:22px; right:22px; background:var(--surface); border:1px solid var(--border); padding:12px 18px; border-radius:10px; box-shadow:var(--shadow); font-size:13px; z-index:200; display:flex; align-items:center; gap:8px;}
.day-col{background:var(--surface2); border-radius:10px; padding:10px; min-height:120px;}
.day-col h4{font-size:12px; margin-bottom:8px; color:var(--ink-dim); display:flex; justify-content:space-between;}
.priority-item{display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; background:var(--surface2); margin-bottom:8px;}
.priority-rank{font-family:var(--font-mono); font-weight:700; color:var(--accent); width:22px; text-align:center;}
 .app-footer{margin-top:34px;padding:18px 8px 4px;border-top:1px solid var(--border);color:var(--ink-faint);}
 .footer-credit{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-mono);} .picker-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;} .picker-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--border);background:var(--surface2);border-radius:10px;cursor:pointer;transition:.15s;} .picker-item:hover{border-color:var(--accent);transform:translateY(-1px);} .picker-item input{accent-color:var(--accent);width:16px;height:16px;} .picker-group{margin-bottom:18px;}
 .footer-credit b{color:var(--accent);font-weight:700}.footer-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}.footer-sep{opacity:.45}
 @media(max-width:700px){.app-footer{margin-top:24px}.footer-credit{font-size:9px;gap:6px}.footer-sep{display:none}}
::placeholder{color:var(--ink-faint);}

.subject-actions{display:flex;gap:5px;align-items:center}
.subject-actions .icon-action{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:10px;background:var(--surface2);color:var(--ink);cursor:pointer}
.subject-actions .icon-action:hover{transform:translateY(-1px);border-color:var(--accent,#7C6CF6)}
.subject-actions .danger-icon:hover{color:#F0555A;border-color:#F0555A}
</style>
</head>

<script>
/* ============================= ICONS ============================= */

  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',

  fire:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-1-2-1-3.5a3 3 0 0 1 3-3c1.5 3 3 5.5 3 8a6.5 6.5 0 0 1-13 0c0-3.5 2-6.5 4-9 .5 1.5 1 2.5 2 3.5-1 1-1 2-1 3.5z"/></svg>',

};

/* ============================= STATE ============================= */
const CHECKLIST_ITEMS = [
  ['lectures','Lectures'],['lectureNotes','Lecture Notes'],['shortNotes','Short Notes'],
  ['ncertReading','NCERT Reading'],['ncertQuestions','NCERT Questions'],['dpp','DPP'],
  ['module','Module'],['practiceQuestions','Practice Qs'],['pyqs','PYQs'],
  ['importantQuestions','Important Qs'],['formulaRevision','Formula Revision'],['conceptRevision','Concept Revision'],
  ['firstRevision','1st Revision'],['secondRevision','2nd Revision'],['mockTest','Mock/Test'],['errorAnalysis','Error Analysis']
];

function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysAgoISO(n){ let d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function daysFromNowISO(n){ let d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function subjectById(id){ return state.subjects.find(s=>s.id===id); }
function chapterById(id){ return state.chapters.find(c=>c.id===id); }

/* ---- computed metrics ---- */
function chapterCompletion(ch){
  const cl = ch.checklist||{};
  let done=0; CHECKLIST_ITEMS.forEach(([k])=>{ if(cl[k]) done++; });
  return Math.round(done/CHECKLIST_ITEMS.length*100);
}
function chaptersOf(subjectId){ return state.chapters.filter(c=>c.subjectId===subjectId); }
function lecturesOf(chapterId){ return state.lectures.filter(l=>l.chapterId===chapterId); }
function subjectStats(subjectId){
  const chs = chaptersOf(subjectId);
  const total = chs.length;
  const completed = chs.filter(c=>c.status==='Completed').length;
  const pct = total? Math.round(chs.reduce((a,c)=>a+chapterCompletion(c),0)/total) : 0;
  const lecs = state.lectures.filter(l=>l.subjectId===subjectId);
  const lecDone = lecs.filter(l=>l.status==='Completed').length;
  const hrs = state.sessions.filter(s=>s.subjectId===subjectId).reduce((a,s)=>a+(s.duration||0),0)/60;
  const tsts = state.tests.filter(t=>t.subjectId===subjectId);
  const avgScore = tsts.length? Math.round(tsts.reduce((a,t)=>a+(t.marksObtained/t.maxMarks*100),0)/tsts.length) : null;
  return {total, completed, pct, totalLec: lecs.length, lecDone, lecPending: lecs.length-lecDone, hrs: Math.round(hrs*10)/10, avgScore};
}
function overallCompletion(examFilter){
  let chs = state.chapters;
  if(examFilter) chs = chs.filter(c=>{ const s=subjectById(c.subjectId); return s && (s.exam===examFilter || s.exam==='Both'); });
  if(!chs.length) return 0;
  return Math.round(chs.reduce((a,c)=>a+chapterCompletion(c),0)/chs.length);
}
function studyHoursBetween(fromISO,toISO){
  return state.sessions.filter(s=>s.date>=fromISO && s.date<=toISO).reduce((a,s)=>a+(s.duration||0),0)/60;
}
function weekBounds(d=new Date()){
  const day=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-day);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return [mon.toISOString().slice(0,10), sun.toISOString().slice(0,10)];
}
function currentStreak(){
  const dates = new Set(state.sessions.map(s=>s.date));
  let streak=0, d=new Date();
  if(!dates.has(todayISO())) d.setDate(d.getDate()-1);
  while(dates.has(d.toISOString().slice(0,10))){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function totalXP(){
  let xp = state.sessions.reduce((a,s)=>a+Math.round((s.duration||0)/2),0);
  xp += state.chapters.filter(c=>c.status==='Completed').length*50;
  xp += state.tests.length*20;
  return xp;
}
function levelFromXP(xp){ return Math.floor(xp/500)+1; }
function badgeList(){
  const streak=currentStreak();
  const lecDone = state.lectures.filter(l=>l.status==='Completed').length;
  const totalHrs = state.sessions.reduce((a,s)=>a+(s.duration||0),0)/60;
  const pyqSolved = state.pyqs.reduce((a,p)=>a+(p.attempted||0),0);
  const chapDone = state.chapters.filter(c=>c.status==='Completed').length;
  const subjFull = state.subjects.some(s=> chaptersOf(s.id).length>0 && chaptersOf(s.id).every(c=>c.status==='Completed'));
  return [
    {icon:'🔥', title:'7 Day Streak', earned: streak>=7},
    {icon:'🎬', title:'50 Lectures', earned: lecDone>=50},
    {icon:'📘', title:'First Chapter', earned: chapDone>=1},
    {icon:'🎯', title:'100 PYQs', earned: pyqSolved>=100},
    {icon:'⏱️', title:'50 Study Hrs', earned: totalHrs>=50},
    {icon:'🏆', title:'Subject Mastered', earned: subjFull},
  ];
}
function priorityScore(ch){
  let score = (100-chapterCompletion(ch))*1.0;
  if(ch.priority==='Very High') score+=40; else if(ch.priority==='High') score+=25; else if(ch.priority==='Medium') score+=10;
  const lecs = lecturesOf(ch.id); const pending = lecs.filter(l=>l.status!=='Completed').length;
  score += pending*3;
  const tsts = state.tests.filter(t=>t.chapterId===ch.id);
  if(tsts.length){ const avg = tsts.reduce((a,t)=>a+(t.marksObtained/t.maxMarks*100),0)/tsts.length; if(avg<50) score+=30; else if(avg<70) score+=15; }
  const revs = state.revisions.filter(r=>r.chapterId===ch.id);
  const overdue = revs.some(r=>r.status!=='Done' && r.dueDate < todayISO());
  if(overdue) score+=25;
  if(ch.targetDate && ch.targetDate < daysFromNowISO(7) && ch.status!=='Completed') score+=20;
  return Math.round(score);
}

function librarySubjects(){ return Object.values(SUBJECT_LIBRARY).flat(); }
function libraryChapters(subjectName){ return CHAPTER_LIBRARY[subjectName] || []; }

function defaultState(){
  return emptyState();
}

async function loadState(){
  try{
    // One-time migration: this build starts as a completely blank universal app.
    // Any old syllabus/sample data from previous builds is removed only once.
    if(localStorage.getItem('command12-universal-v3') !== '1'){
      localStorage.removeItem('command12-app-data');
      localStorage.setItem('command12-universal-v3','1');
    }
    const saved = localStorage.getItem('command12-app-data');
    if(saved){
      state = JSON.parse(saved);
      state = normalizeState(state);

      // Empty is a valid user state. Never inject sample subjects or chapters.

    }else{
      state = emptyState();
      persist(true);
    }
  }catch(e){
    console.error('Load failed:', e);
    state = emptyState();
    persist(true);
  }

  try{
    const th = localStorage.getItem('command12-theme');
    if(th === 'dark' || th === 'light') ui.theme = th;
  }catch(e){}

  document.body.setAttribute('data-theme', ui.theme);
}

function normalizeState(s){
  const d = emptyState();
  return {
    ...d,
    ...s,
    subjects: Array.isArray(s.subjects) ? s.subjects : [],
    chapters: Array.isArray(s.chapters) ? s.chapters : [],
    lectures: Array.isArray(s.lectures) ? s.lectures : [],
    sessions: Array.isArray(s.sessions) ? s.sessions : [],
    tests: Array.isArray(s.tests) ? s.tests : [],
    pyqs: Array.isArray(s.pyqs) ? s.pyqs : [],
    revisions: Array.isArray(s.revisions) ? s.revisions : [],
    plannerTasks: Array.isArray(s.plannerTasks) ? s.plannerTasks : [],
    resources: Array.isArray(s.resources) ? s.resources : [],
    goals: {...d.goals, ...(s.goals || {})},
    settings: {...d.settings, ...(s.settings || {})},
    habits: Array.isArray(s.habits) ? s.habits : []
  };
}

function emptyState(){
  // UNIVERSAL START: no sample subjects, chapters, or study records.
  return {
    subjects: [], chapters: [], lectures: [], sessions: [], tests: [], pyqs: [], revisions: [],
    plannerTasks: [], resources: [],
    goals: {dailyHours:6, weeklyHours:40, monthlyHours:160, dailyLectures:2, weeklyLectures:12, chaptersPerWeek:2, pyqsPerDay:15, testsPerWeek:2},
    settings: {examDate_cbse:'', examDate_jee:''}, habits: []
  };
}

function persist(immediate){
  clearTimeout(saveTimer);

  const doSave = ()=>{
    try{
      localStorage.setItem('command12-app-data', JSON.stringify(state));
      localStorage.setItem('command12-last-saved', new Date().toISOString());
      window.dispatchEvent(new CustomEvent('command12-data-saved'));
    }catch(e){
      console.error('Save failed:', e);
      toast('Could not save data');
    }
  };

  if(immediate) return doSave();
  saveTimer = setTimeout(doSave, 250);
}
function markDirty(){ persist(false); render(); }

/* ============================= RING SVG HELPER ============================= */
function ring(pct, size, color, label, value){
  const r = size/2 - 8; const c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return `<div class="ring-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="9"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="9" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .6s;"/>
      <text x="50%" y="47%" text-anchor="middle" fill="var(--ink)" font-family="JetBrains Mono" font-weight="700" font-size="${size*0.19}">${pct}%</text>
      <text x="50%" y="64%" text-anchor="middle" fill="var(--ink-faint)" font-family="Inter" font-size="${size*0.075}">${value||''}</text>
    </svg>
    <div class="ring-label">${label}</div>
  </div>`;
}

    ${statCard('Total Study Hours', totalHrs+'h', `${weekHrs}h this week`, 'var(--green)')}
  </div>`;

  html += `<div class="grid g4" style="margin-bottom:16px;">
    ${statCard("Today's Study", todayHrs+'h', `Target ${state.goals.dailyHours}h`, todayHrs>=state.goals.dailyHours?'var(--green)':'var(--red)')}
    ${statCard('Weekly Target', weekGoalPct+'%', `${weekHrs}h / ${state.goals.weeklyHours}h`, 'var(--accent)')}
    ${statCard('This Month', monthHrs+'h', 'hours logged', 'var(--cyan)')}
    ${statCard('Pending Tasks', pendingTasks, 'in daily planner', 'var(--amber)')}
  </div>`;

  html += `<div class="grid g2" style="margin-bottom:16px;">
    <div class="card">
      <div class="section-title">What Should I Study Next? <span class="pill blue">Smart Priority</span></div>
      ${priorityList.map((p,i)=>`<div class="priority-item"><div class="priority-rank">${i+1}</div>
        <div style="flex:1;"><div style="font-weight:600; font-size:13px;"><span class="subj-dot" style="background:${subjectColor(p.c.subjectId)}"></span>${p.c.name}</div>
        <div class="smallmuted">${subjectById(p.c.subjectId)?.name} · ${chapterCompletion(p.c)}% done · ${p.c.priority} priority</div></div>
        <div class="pill ${p.score>60?'red':p.score>35?'amber':'gray'}">Urgency ${p.score}</div></div>`).join('') || `<div class="empty">All caught up 🎉</div>`}
    </div>
    <div class="card">
      <div class="section-title">Weak vs Strong Chapters</div>
      <div style="font-size:11.5px; font-weight:700; color:var(--red); text-transform:uppercase; margin-bottom:8px;">Needs Attention</div>
      ${weakChapters.map(w=>`<div style="display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px;"><span>${w.c.name}</span><span class="pill red">${Math.round(w.s)}%</span></div>`).join('') || '<div class="smallmuted" style="padding:6px 0 14px;">No weak chapters flagged yet.</div>'}
      <div style="font-size:11.5px; font-weight:700; color:var(--green); text-transform:uppercase; margin:14px 0 8px;">Strong Chapters</div>
      ${strongChapters.map(w=>`<div style="display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px;"><span>${w.c.name}</span><span class="pill green">${Math.round(w.s)}%</span></div>`).join('') || '<div class="smallmuted" style="padding:6px 0;">Keep testing to surface strengths.</div>'}
    </div>
  </div>`;

  html += `<div class="grid g2">
    <div class="card"><div class="section-title">Weekly Study Activity</div><canvas id="chartWeekly" height="180"></canvas></div>
    <div class="card"><div class="section-title">Subject-wise Completion</div><canvas id="chartSubjDonut" height="180"></canvas></div>
  </div>`;

  afterRenderHooks = ()=>{
    drawWeeklyBarChart('chartWeekly');
    drawSubjectDonut('chartSubjDonut');
  };
  return html;
}
function statCard(label, value, delta, color){
  return `<div class="card stat-card"><div class="stat-label">${label}</div><div class="stat-value" style="${color?`color:${color}`:''}">${value}</div><div class="stat-delta">${delta||''}</div></div>`;
}

let chartRegistry = {};
function destroyChart(id){ if(chartRegistry[id]){ chartRegistry[id].destroy(); delete chartRegistry[id]; } }
function chartColors(){
  const dark = ui.theme==='dark';
  return {grid: dark?'#232C42':'#E4E1D8', text: dark?'#8892AB':'#6B6D76'};
}
function drawWeeklyBarChart(canvasId){
  const el = document.getElementById(canvasId); if(!el) return;
  destroyChart(canvasId);
  const labels=[], planned=[], actual=[];
  for(let i=6;i>=0;i--){ const d=daysAgoISO(i); labels.push(new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}));
    planned.push(state.goals.dailyHours); actual.push(Math.round(studyHoursBetween(d,d)*10)/10); }
  const cc = chartColors();
  chartRegistry[canvasId] = new Chart(el, {type:'bar', data:{labels, datasets:[
    {label:'Planned', data:planned, backgroundColor: cc.grid, borderRadius:5, barPercentage:.55},
    {label:'Actual', data:actual, backgroundColor:'#7C6CF6', borderRadius:5, barPercentage:.55}
  ]}, options:{responsive:true, plugins:{legend:{labels:{color:cc.text, font:{size:11}}}}, scales:{
    x:{ticks:{color:cc.text}, grid:{display:false}}, y:{ticks:{color:cc.text}, grid:{color:cc.grid}}}}});
}
function drawSubjectDonut(canvasId){
  const el = document.getElementById(canvasId); if(!el) return;
  destroyChart(canvasId);
  const subs = state.subjects.filter(s=>chaptersOf(s.id).length>0);
  const data = subs.map(s=>subjectStats(s.id).pct);
  const cc = chartColors();
  chartRegistry[canvasId] = new Chart(el, {type:'doughnut', data:{labels:subs.map(s=>s.name), datasets:[{data, backgroundColor:subs.map(s=>SUBJECT_COLORS[s.name]||'#888'), borderWidth:0}]},
    options:{responsive:true, cutout:'68%', plugins:{legend:{position:'bottom', labels:{color:cc.text, font:{size:11}, boxWidth:10}}}}});
}

function editSubjectDirect(id){
  const s=subjectById(id);
  if(!s){ toast('Subject not found'); return; }
  openSubjectModal(id);
}

function deleteSubjectDirect(id){
  const s=subjectById(id);
  if(!s){ toast('Subject not found'); return; }
  const chapterIds=state.chapters.filter(c=>c.subjectId===id).map(c=>c.id);
  if(!window.confirm(`Delete \"${s.name}\" and all its chapters, lectures and related data?`)) return;
  state.lectures=state.lectures.filter(x=>!chapterIds.includes(x.chapterId));
  state.revisions=state.revisions.filter(x=>!chapterIds.includes(x.chapterId));
  state.tests=state.tests.filter(x=>!chapterIds.includes(x.chapterId));
  state.pyqs=state.pyqs.filter(x=>!chapterIds.includes(x.chapterId));
  state.chapters=state.chapters.filter(x=>x.subjectId!==id);
  state.sessions=state.sessions.filter(x=>x.subjectId!==id);
  state.subjects=state.subjects.filter(x=>x.id!==id);
  ui.subjectDetail=null;
  ui.page='subjects';
  persist(true);
  render();
  toast(`\"${s.name}\" deleted`);
}

function openSubjectActions(id){
  const s=subjectById(id); if(!s) return;
  showModal('Subject Actions', `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;"><span class="subj-dot" style="background:${s.color||colorForSubject(s.name)}"></span><div><b style="font-family:var(--font-display);font-size:18px;">${s.name}</b><div class="smallmuted">${s.exam||'Personal study subject'}</div></div></div>

function openSubjectPicker(){
  const groups = Object.entries(SUBJECT_LIBRARY).map(([group,items])=>`
    <div class="subject-picker-group"><div class="section-title" style="margin:0 0 10px;">${group}</div>
      <div class="picker-grid">${items.map(name=>{const checked=state.subjects.some(s=>s.name.toLowerCase()===name.toLowerCase());return `<label class="picker-item"><input type="checkbox" class="subject-pick" value="${name}" ${checked?'checked':''}><span>${name}</span></label>`}).join('')}</div>
    </div>`).join('');
  showModal('Choose Subjects', `
    <div class="subject-picker-toolbar"><span class="smallmuted">Library options only — nothing is added until you save.</span><b id="subjectPickCount">${state.subjects.length} added</b></div>
    <div style="max-height:430px;overflow:auto;padding-right:3px;">${groups}</div>
    <div class="card" style="margin-top:12px;padding:13px;border-radius:14px;"><div class="section-title" style="margin-bottom:8px;">Custom Subject</div><input id="custom_subject" placeholder="e.g. Psychology, JEE Advanced, Urdu Literature"></div>
  `, ()=>{
    const names=[...document.querySelectorAll('.subject-pick:checked')].map(x=>x.value);
    const custom=document.getElementById('custom_subject').value.trim(); if(custom) names.push(custom);
    const existing=new Set(state.subjects.map(s=>s.name.toLowerCase()));
    let added=0; names.forEach(name=>{if(existing.has(name.toLowerCase()))return;state.subjects.push({id:'sub_'+uid(),name,exam:'',color:colorForSubject(name)});existing.add(name.toLowerCase());added++;});
    closeModal(); markDirty(); toast(added?`${added} subject${added===1?'':'s'} added`:'No new subjects selected');
  }, true);
}

function colorForSubject(name){
  const palette=['#7C6CF6','#33C481','#F5A623','#3FC6E0','#F0555A','#C084FC','#E07A5F','#4D96FF','#2EC4B6','#FF6B6B'];
  let n=0; for(let i=0;i<name.length;i++) n=(n*31+name.charCodeAt(i))>>>0;
  return palette[n%palette.length];
}

function deleteSubject(id){
  if(!confirm('Delete this subject and all its chapters/lectures?')) return;
  state.chapters.filter(c=>c.subjectId===id).forEach(c=>{
    state.lectures = state.lectures.filter(l=>l.chapterId!==c.id);
    state.revisions = state.revisions.filter(r=>r.chapterId!==c.id);
    state.tests = state.tests.filter(t=>t.chapterId!==c.id);
    state.pyqs = state.pyqs.filter(p=>p.chapterId!==c.id);
  });
  state.chapters = state.chapters.filter(c=>c.subjectId!==id);
  state.sessions = state.sessions.filter(s=>s.subjectId!==id);
  state.subjects = state.subjects.filter(s=>s.id!==id);
  if(ui.subjectDetail===id) ui.subjectDetail=null;
  ui.page='subjects';
  markDirty();
  toast('Subject deleted');
}

function openSubject(id){ ui.subjectDetail=id; ui.page='subjectDetail'; render(); window.scrollTo(0,0); }

function pageSubjectDetail(){

  if(!chs.length){
    html += `<div class="card empty" style="padding:56px 20px;"><div style="font-size:34px;margin-bottom:10px;">📖</div><div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px;">No chapters yet</div><div style="margin-bottom:16px;">Add your first chapter to start tracking this subject.</div><button class="btn" onclick="openChapterModalForSubject('${sub.id}')">${ICONS.plus} Add Chapter</button></div>`;
    return html;
  }
  html += `<div class="grid g2">`;

    const pct=chapterCompletion(c);
    html += `<div class="card chapter-card" data-chapter-id="${c.id}" style="cursor:pointer; user-select:none; position:relative;" title="Click: checklist · Hold: edit/delete/priority">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;"><span>${statusPill(c.status)}</span><span class="smallmuted">${pct}%</span></div>
      <div class="progress-bar" style="margin-top:7px;"><div class="progress-fill" style="width:${pct}%;background:${sub.color||'#7C6CF6'}"></div></div>
      <div class="smallmuted" style="margin-top:12px;">Click for checklist · Hold for actions</div>

  return html;

function openChapterModalForSubject(subjectId){ ui.chapterPresetSubject=subjectId; openChapterModal(); }

function openChapterQuickMenu(id){
  const c=chapterById(id); if(!c) return;
  showModal(`Chapter Actions`, `
    <div style="padding:4px 0 10px;"><div class="smallmuted">Chapter</div><div style="font-family:var(--font-display);font-size:18px;font-weight:700;margin-top:4px;">${c.name}</div></div>
    <div class="field"><label>Chapter Name</label><input id="quick_name" value="${c.name}"></div>
    <div class="field"><label>Priority</label><select id="quick_priority">${['Low','Medium','High','Very High'].map(v=>`<option ${c.priority===v?'selected':''}>${v}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px;margin-top:8px;"><button class="btn secondary" type="button" onclick="closeModal();openChecklistModal('${c.id}')">📋 Checklist</button><button class="btn danger" type="button" onclick="closeModal();deleteChapter('${c.id}')">${ICONS.trash} Delete</button></div>
  `, ()=>{ const name=document.getElementById('quick_name').value.trim(); if(!name){toast('Chapter name cannot be empty');return;} c.name=name; c.priority=document.getElementById('quick_priority').value; closeModal(); markDirty(); });
}

function attachChapterLongPress(){
  document.querySelectorAll('.chapter-card[data-chapter-id]').forEach(el=>{
    let timer=null, fired=false;
    const start=()=>{ fired=false; clearTimeout(timer); timer=setTimeout(()=>{ fired=true; openChapterQuickMenu(el.dataset.chapterId); },650); };
    const cancel=()=>clearTimeout(timer);
    el.addEventListener('pointerdown',start); el.addEventListener('pointerup',()=>{ const was=fired; cancel(); if(!was) openChecklistModal(el.dataset.chapterId); });
    el.addEventListener('pointerleave',cancel); el.addEventListener('pointercancel',cancel);
    el.addEventListener('contextmenu',e=>{e.preventDefault();cancel();openChapterQuickMenu(el.dataset.chapterId);});
  });
}

function openChapterChooserGlobal(){
  if(!state.subjects.length){toast('Add a subject first'); openSubjectPicker(); return;}
  const opts=state.subjects.map(s=>`<button class="btn secondary" style="justify-content:flex-start;" onclick="closeModal();openChapterPicker('${s.id}')">${s.name}</button>`).join('');
  showModal('Choose Subject for Chapters', `<div class="smallmuted" style="margin-bottom:12px;">Pick the subject whose chapters you want to add.</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;">${opts}</div>` , ()=>closeModal(), true);
}

/* ============================= CHAPTERS ============================= */
function pageChapters(){
  const f = ui.chapterFilter;

  html += `<div class="filterbar">
    <div class="searchbox">${ICONS.search}<input placeholder="Search chapters..." oninput="ui.chapterFilter.q=this.value; render()" value="${f.q||''}"></div>
    <select onchange="ui.chapterFilter.subject=this.value; render()"><option value="">All Subjects</option>${state.subjects.map(s=>`<option value="${s.id}" ${f.subject===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
    <select onchange="ui.chapterFilter.status=this.value; render()"><option value="">All Status</option>${['Not Started','In Progress','Completed','Revision'].map(v=>`<option ${f.status===v?'selected':''}>${v}</option>`).join('')}</select>
    <select onchange="ui.chapterFilter.priority=this.value; render()"><option value="">All Priority</option>${['Low','Medium','High','Very High'].map(v=>`<option ${f.priority===v?'selected':''}>${v}</option>`).join('')}</select>
  </div>`;
  let chs = state.chapters;
  if(f.q) chs = chs.filter(c=>c.name.toLowerCase().includes(f.q.toLowerCase()));
  if(f.subject) chs = chs.filter(c=>c.subjectId===f.subject);
  if(f.status) chs = chs.filter(c=>c.status===f.status);
  if(f.priority) chs = chs.filter(c=>c.priority===f.priority);
  html += `<div class="card" style="padding:0;"><table><thead><tr><th>Chapter</th><th>Subject</th><th>Status</th><th>Priority</th><th>Difficulty</th><th>Progress</th><th>Target</th><th></th></tr></thead><tbody>`;
  chs.forEach(c=>{
    const pct = chapterCompletion(c);
    html += `<tr class="rowhover"><td><b>${c.number}. ${c.name}</b></td>
      <td><span class="subj-dot" style="background:${subjectColor(c.subjectId)}"></span>${subjectById(c.subjectId)?.name||'—'}</td>
      <td>${statusPill(c.status)}</td><td>${priorityPill(c.priority)}</td><td>${c.difficulty}</td>
      <td><div style="display:flex; align-items:center; gap:8px;"><div class="progress-bar" style="width:80px;"><div class="progress-fill" style="width:${pct}%"></div></div><span class="smallmuted">${pct}%</span></div></td>
      <td class="smallmuted">${fmtDate(c.targetDate)}</td>
      <td><div style="display:flex; gap:2px;"><button class="icon-action" onclick="openChecklistModal('${c.id}')">📋</button><button class="icon-action" onclick="openChapterModal('${c.id}')">${ICONS.edit}</button><button class="icon-action" onclick="deleteChapter('${c.id}')">${ICONS.trash}</button></div></td></tr>`;
  });
  html += `</tbody></table>${chs.length===0?'<div class="empty">No chapters match your filters.</div>':''}</div>`;
  return html;
}
function statusPill(s){ const map={'Not Started':'gray','In Progress':'amber','Completed':'green','Revision':'blue'}; return `<span class="pill ${map[s]||'gray'}">${s}</span>`; }
function priorityPill(p){ const map={'Low':'gray','Medium':'blue','High':'amber','Very High':'red'}; return `<span class="pill ${map[p]||'gray'}">${p}</span>`; }

function openChapterModal(id){
  if(!id && ui.chapterPresetSubject){ openChapterPicker(ui.chapterPresetSubject); ui.chapterPresetSubject=''; return; }
  const c = id ? chapterById(id) : {name:'', number:state.chapters.length+1, subjectId:state.subjects[0]?.id||'', status:'Not Started', priority:'Medium', difficulty:'Medium', targetDate:''};

    <div class="fieldrow"><div class="field"><label>Difficulty</label><select id="f_diff">${['Easy','Medium','Hard'].map(v=>`<option ${c.difficulty===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Target Date</label><input id="f_target" type="date" value="${c.targetDate||''}"></div></div>
  `, ()=>{

function openChapterPicker(subjectId){
  const sub=subjectById(subjectId); if(!sub){toast('Add a subject first');return;}
  const options=libraryChapters(sub.name);
  const body = options.length ? options.map((name,i)=>`<label class="picker-item"><input type="checkbox" class="chapter-pick" value="${name}"><span>${i+1}. ${name}</span></label>`).join('') : `<div class="empty" style="padding:24px 10px;">No built-in chapter list for <b>${sub.name}</b>. Add your own chapters below.</div>`;
  showModal(`Add Chapters — ${sub.name}`, `
    <div class="smallmuted" style="margin-bottom:12px;">Select chapters from the optional library. Only selected chapters will be added.</div>
    <div class="picker-grid" style="max-height:420px;overflow:auto;">${body}</div>
    <div class="card" style="margin-top:14px;padding:12px;"><div class="section-title">Custom Chapter</div><input id="custom_chapter" placeholder="e.g. Unit 1 / Chapter name"></div>
  `, ()=>{
    const names=[...document.querySelectorAll('.chapter-pick:checked')].map(x=>x.value);
    const custom=document.getElementById('custom_chapter').value.trim(); if(custom) names.push(custom);
    if(!names.length){toast('Select or enter at least one chapter');return;}
    const existing=new Set(chaptersOf(subjectId).map(c=>c.name.toLowerCase())); let added=0;
    names.forEach(name=>{ if(existing.has(name.toLowerCase())) return; const checklist={}; CHECKLIST_ITEMS.forEach(([k])=>checklist[k]=false); state.chapters.push({id:'ch_'+uid(),subjectId,name,number:chaptersOf(subjectId).length+1,status:'Not Started',priority:'Medium',difficulty:'Medium',targetDate:'',actualDate:'',checklist,notes:''}); existing.add(name.toLowerCase()); added++; });
    closeModal(); markDirty(); toast(`${added} chapter${added===1?'':'s'} added`);
  }, true);
}

function deleteChapter(id){
  if(!confirm('Delete this chapter and related data?')) return;
  state.lectures = state.lectures.filter(l=>l.chapterId!==id);
  state.revisions = state.revisions.filter(r=>r.chapterId!==id);
  state.tests = state.tests.filter(t=>t.chapterId!==id);
  state.pyqs = state.pyqs.filter(p=>p.chapterId!==id);
  state.chapters = state.chapters.filter(c=>c.id!==id);
  markDirty();
}
function openChecklistModal(id){
  const c = chapterById(id);
  showModal(`Checklist — ${c.name}`, `
    <div class="checklist-grid">
      ${CHECKLIST_ITEMS.map(([k,label])=>`<label class="chk-item"><input type="checkbox" id="chk_${k}" ${c.checklist[k]?'checked':''}><span>${label}</span></label>`).join('')}
    </div>
    <div class="field" style="margin-top:14px;"><label>Notes</label><textarea id="f_notes" rows="2">${c.notes||''}</textarea></div>
    <div style="margin-top:10px; display:flex; justify-content:space-between; align-items:center;"><span class="smallmuted">Overall completion updates automatically</span><span class="pill blue" id="livePct">${chapterCompletion(c)}%</span></div>
  `, ()=>{
    CHECKLIST_ITEMS.forEach(([k])=>{ c.checklist[k] = document.getElementById('chk_'+k).checked; });

/* ============================= LECTURES ============================= */
function pageLectures(){
  const lecs = state.lectures;
  const totalHrs = lecs.reduce((a,l)=>a+l.duration,0)/60;
  const doneHrs = lecs.filter(l=>l.status==='Completed').reduce((a,l)=>a+l.duration,0)/60;
  const pendingLecs = lecs.filter(l=>l.status!=='Completed');
  const pendingHrs = pendingLecs.reduce((a,l)=>a+l.duration,0)/60;
  const avgDur = lecs.length? lecs.reduce((a,l)=>a+l.duration,0)/lecs.length : 45;

  let html = topbar('Lecture Tracker', 'Watch progress, backlog, and pacing', `<button class="btn" onclick="openLectureChooser()">${ICONS.plus} Add Lecture</button>`);
  html += `<div class="grid g4" style="margin-bottom:16px;">
    ${statCard('Total Lectures', lecs.length, Math.round(totalHrs)+'h total')}
    ${statCard('Completed', lecs.length-pendingLecs.length, Math.round(doneHrs)+'h watched','var(--green)')}
    ${statCard('Pending', pendingLecs.length, Math.round(pendingHrs)+'h remaining','var(--amber)')}
    ${statCard('Avg Duration', Math.round(avgDur)+' min', 'per lecture')}
  </div>`;

  html += `<div class="card" style="margin-bottom:16px;"><div class="section-title">Backlog Calculator</div>
    <div class="fieldrow" style="align-items:end;">
      <div class="field" style="margin-bottom:0;"><label>Pending Lectures</label><input value="${pendingLecs.length}" disabled></div>
      <div class="field" style="margin-bottom:0;"><label>Deadline</label><input id="backlogDeadline" type="date" value="${daysFromNowISO(30)}" oninput="updateBacklog()"></div>
    </div>
    <div id="backlogResult" style="margin-top:14px; display:flex; gap:26px; flex-wrap:wrap;"></div>
  </div>`;

  html += `<div class="filterbar">
    <select onchange="ui.lectureFilter.subject=this.value; render()"><option value="">All Subjects</option>${state.subjects.map(s=>`<option value="${s.id}" ${ui.lectureFilter.subject===s.id?'selected':''}>${s.name}</option>`).join('')}</select>
    <select onchange="ui.lectureFilter.status=this.value; render()"><option value="">All Status</option>${['Not Started','Watching','Completed'].map(v=>`<option ${ui.lectureFilter.status===v?'selected':''}>${v}</option>`).join('')}</select>
  </div>`;
  let filtered = lecs;
  if(ui.lectureFilter.subject) filtered = filtered.filter(l=>l.subjectId===ui.lectureFilter.subject);
  if(ui.lectureFilter.status) filtered = filtered.filter(l=>l.status===ui.lectureFilter.status);
  html += `<div class="card" style="padding:0;"><table><thead><tr><th>#</th><th>Title</th><th>Subject / Chapter</th><th>Teacher</th><th>Duration</th><th>Status</th><th></th></tr></thead><tbody>`;
  filtered.slice(0,80).forEach(l=>{
    const ch = chapterById(l.chapterId);
    html += `<tr class="rowhover"><td class="smallmuted">${l.number}</td><td>${l.title}</td>
      <td><span class="subj-dot" style="background:${subjectColor(l.subjectId)}"></span>${subjectById(l.subjectId)?.name} <span class="smallmuted">· ${ch?ch.name:'—'}</span></td>
      <td class="smallmuted">${l.teacher}</td><td class="smallmuted">${l.duration} min</td>
      <td><select onchange="cycleLectureStatus('${l.id}', this.value)" style="width:auto; padding:4px 8px; font-size:12px;">${['Not Started','Watching','Completed'].map(v=>`<option ${l.status===v?'selected':''}>${v}</option>`).join('')}</select></td>
      <td><div style="display:flex; gap:2px;"><button class="icon-action" onclick="openLectureModal('${l.id}')">${ICONS.edit}</button><button class="icon-action" onclick="deleteLecture('${l.id}')">${ICONS.trash}</button></div></td></tr>`;
  });
  html += `</tbody></table>${filtered.length===0?'<div class="empty">No lectures found.</div>':''}</div>`;
  afterRenderHooks = updateBacklog;
  return html;
}
function updateBacklog(){
  const el = document.getElementById('backlogResult'); if(!el) return;
  const pending = state.lectures.filter(l=>l.status!=='Completed');
  const avgDur = state.lectures.length? state.lectures.reduce((a,l)=>a+l.duration,0)/state.lectures.length : 45;
  const backlogHrs = pending.length*avgDur/60;
  const deadline = document.getElementById('backlogDeadline').value;
  const daysLeft = Math.max(1, Math.ceil((new Date(deadline)-new Date(todayISO()))/(1000*60*60*24)));
  const perDay = pending.length/daysLeft;
  el.innerHTML = `
    <div><div class="stat-label">Backlog Hours</div><div class="stat-value" style="font-size:20px;">${Math.round(backlogHrs*10)/10}h</div></div>
    <div><div class="stat-label">Days Left</div><div class="stat-value" style="font-size:20px;">${daysLeft}</div></div>
    <div><div class="stat-label">Lectures / Day Needed</div><div class="stat-value" style="font-size:20px; color:var(--accent)">${perDay.toFixed(1)}</div></div>
    <div><div class="stat-label">Hours / Day Needed</div><div class="stat-value" style="font-size:20px; color:var(--accent)">${(perDay*avgDur/60).toFixed(1)}h</div></div>
  `;
}

  html += `<div class="grid g3" style="margin-bottom:16px;">
    ${statCard('Today', Math.round(today*10)/10+'h','')}
    ${statCard('This Week', Math.round(week*10)/10+'h','')}
    ${statCard('This Month', Math.round(month*10)/10+'h','')}

  const sessions = [...state.sessions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60);

    html += `<tr class="rowhover"><td class="smallmuted">${fmtDate(s.date)}</td><td><span class="subj-dot" style="background:${subjectColor(s.subjectId)}"></span>${subjectById(s.subjectId)?.name||'—'}</td>

/* ============================= DAILY PLANNER ============================= */
function pagePlanner(){
  const date = ui.plannerDate || todayISO();
  const tasks = state.plannerTasks.filter(t=>t.date===date);
  const done = tasks.filter(t=>t.done).length;
  const pct = tasks.length? Math.round(done/tasks.length*100) : 0;
  const actualMin = tasks.reduce((a,t)=>a+(t.done?t.estMin:t.actMin||0),0);
  let html = topbar('Daily Planner', 'Plan today, track completion in real time', `<button class="btn" onclick="openTaskModal()">${ICONS.plus} Add Task</button>`);
  html += `<div class="card" style="margin-bottom:16px; display:flex; align-items:center; gap:20px; flex-wrap:wrap;">
    <input type="date" value="${date}" style="width:auto;" onchange="ui.plannerDate=this.value; render()">
    <div style="flex:1; min-width:200px;"><div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;"><span class="smallmuted">Tasks Completed</span><b>${done}/${tasks.length}</b></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>
    <div class="smallmuted">Target: <b style="color:var(--ink)">${state.goals.dailyHours}h</b> · Logged: <b style="color:var(--ink)">${Math.round(studyHoursBetween(date,date)*10)/10}h</b></div>
  </div>`;
  html += `<div class="card" style="padding:0;">`;
  if(tasks.length===0){ html += `<div class="empty">No tasks planned for this day. Add one to get started.</div>`; }
  else {
    tasks.sort((a,b)=>(a.start||'').localeCompare(b.start||'')).forEach(t=>{
      html += `<div style="display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border);">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')" style="width:17px;height:17px;">
        <div style="flex:1; ${t.done?'opacity:.5; text-decoration:line-through;':''}">
          <div style="font-weight:600; font-size:13.5px;">${t.title}</div>
          <div class="smallmuted">${subjectById(t.subjectId)?.name||''} ${t.start?'· '+t.start+'–'+t.end:''} · Est ${t.estMin}min</div>
        </div>
        ${priorityPill(t.priority)}
        <button class="icon-action" onclick="openTaskModal('${t.id}')">${ICONS.edit}</button>
        <button class="icon-action" onclick="deleteTask('${t.id}')">${ICONS.trash}</button>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

/* ============================= REVISION ============================= */
function pageRevision(){
  const revs = state.revisions;
  const overdue = revs.filter(r=>r.status!=='Done' && r.dueDate<todayISO());
  const today = revs.filter(r=>r.status!=='Done' && r.dueDate===todayISO());
  const upcoming = revs.filter(r=>r.status!=='Done' && r.dueDate>todayISO()).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,8);
  let html = topbar('Revision System', 'Spaced repetition tracker across all chapters');
  html += `<div class="grid g3" style="margin-bottom:16px;">
    ${statCard('Overdue', overdue.length, 'need attention','var(--red)')}
    ${statCard('Due Today', today.length, '','var(--amber)')}
    ${statCard('Upcoming', upcoming.length, 'next in queue','var(--accent)')}
  </div>`;
  const renderList = (title,list,color)=> `<div class="card" style="margin-bottom:16px;"><div class="section-title">${title}</div>
    ${list.length===0?'<div class="smallmuted" style="padding:8px 0;">Nothing here.</div>':list.map(r=>{
      const c = chapterById(r.chapterId); if(!c) return '';
      return `<div style="display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border);">
      <div><b style="font-size:13px;">${c.name}</b><div class="smallmuted">${subjectById(c.subjectId)?.name} · ${r.stage}</div></div>
      <div style="display:flex; align-items:center; gap:10px;"><span class="smallmuted" style="color:${color}">${fmtDate(r.dueDate)}</span><button class="btn secondary" style="padding:5px 10px; font-size:11.5px;" onclick="markRevisionDone('${r.id}')">Mark Done</button></div></div>`;
    }).join('')}
  </div>`;
  html += renderList('Overdue Revisions', overdue, 'var(--red)');
  html += renderList('Due Today', today, 'var(--amber)');
  html += renderList('Upcoming Revisions', upcoming, 'var(--ink-dim)');
  return html;
}
function markRevisionDone(id){
  const r = state.revisions.find(x=>x.id===id); r.status='Done'; r.doneDate=todayISO();
  const stages=['R1','R2','R3','R4','Final']; const idx=stages.indexOf(r.stage);
  if(idx>=0 && idx<stages.length-1){
    state.revisions.push({id:'rev_'+uid(), chapterId:r.chapterId, stage:stages[idx+1], dueDate:daysFromNowISO(7*(idx+2)), status:'Pending'});
  }
  markDirty();
}

/* ============================= TESTS ============================= */
function pageTests(){
  const tests = state.tests;
  const scores = tests.map(t=>t.marksObtained/t.maxMarks*100);
  const avg = scores.length? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  const best = scores.length? Math.round(Math.max(...scores)) : 0;
  const worst = scores.length? Math.round(Math.min(...scores)) : 0;
  let html = topbar('Test & Exam Tracker', 'Performance history and subject-wise analysis', `<button class="btn" onclick="openTestModal()">${ICONS.plus} Add Test</button>`);
  html += `<div class="grid g3" style="margin-bottom:16px;">
    ${statCard('Average Score', avg+'%','across '+tests.length+' tests')}
    ${statCard('Best Score', best+'%','','var(--green)')}
    ${statCard('Worst Score', worst+'%','','var(--red)')}
  </div>`;
  html += `<div class="card" style="margin-bottom:16px;"><div class="section-title">Score Trend</div><canvas id="chartTests" height="90"></canvas></div>`;
  html += `<div class="card" style="padding:0;"><table><thead><tr><th>Test</th><th>Subject</th><th>Date</th><th>Score</th><th>Mistakes</th><th>Weak Topics</th><th></th></tr></thead><tbody>`;
  [...tests].sort((a,b)=>b.date.localeCompare(a.date)).forEach(t=>{
    const pct = Math.round(t.marksObtained/t.maxMarks*100);
    html += `<tr class="rowhover"><td><b>${t.name}</b><div class="smallmuted">${t.type}</div></td>
      <td><span class="subj-dot" style="background:${subjectColor(t.subjectId)}"></span>${subjectById(t.subjectId)?.name}</td>
      <td class="smallmuted">${fmtDate(t.date)}</td>
      <td><span class="pill ${pct>=80?'green':pct>=60?'amber':'red'}">${t.marksObtained}/${t.maxMarks} (${pct}%)</span></td>
      <td class="smallmuted">${t.mistakes}</td><td class="smallmuted">${t.weakTopics||'—'}</td>
      <td><button class="icon-action" onclick="deleteTest('${t.id}')">${ICONS.trash}</button></td></tr>`;
  });
  html += `</tbody></table>${tests.length===0?'<div class="empty">No tests recorded yet.</div>':''}</div>`;
  afterRenderHooks = ()=>{
    const el = document.getElementById('chartTests'); if(!el) return;
    destroyChart('chartTests');
    const sorted = [...tests].sort((a,b)=>a.date.localeCompare(b.date));
    const cc = chartColors();
    chartRegistry['chartTests'] = new Chart(el, {type:'line', data:{labels:sorted.map(t=>fmtDate(t.date)), datasets:[{label:'Score %', data:sorted.map(t=>Math.round(t.marksObtained/t.maxMarks*100)), borderColor:'#7C6CF6', backgroundColor:'#7C6CF633', fill:true, tension:.35}]},
      options:{plugins:{legend:{display:false}}, scales:{x:{ticks:{color:cc.text}, grid:{display:false}}, y:{ticks:{color:cc.text}, grid:{color:cc.grid}}}}});
  };
  return html;
}

/* ============================= PYQ ============================= */
function pagePYQ(){
  const pyqs = state.pyqs;
  const totalAttempted = pyqs.reduce((a,p)=>a+p.attempted,0);
  const totalCorrect = pyqs.reduce((a,p)=>a+p.correct,0);
  const totalQs = pyqs.reduce((a,p)=>a+p.total,0);
  const accuracy = totalAttempted? Math.round(totalCorrect/totalAttempted*100) : 0;
  let html = topbar('PYQ Tracker', 'Previous Year Questions, chapter by chapter', `<button class="btn" onclick="openPYQModal()">${ICONS.plus} Add PYQ Set</button>`);
  html += `<div class="grid g4" style="margin-bottom:16px;">
    ${statCard('Total PYQs', totalQs, '')}
    ${statCard('Attempted', totalAttempted, `${totalQs-totalAttempted} remaining`)}
    ${statCard('Accuracy', accuracy+'%', totalCorrect+' correct', accuracy>=70?'var(--green)':'var(--amber)')}
    ${statCard('Sets Tracked', pyqs.length, '')}
  </div>`;
  html += `<div class="card" style="padding:0;"><table><thead><tr><th>Chapter</th><th>Total</th><th>Attempted</th><th>Correct</th><th>Incorrect</th><th>Skipped</th><th>Accuracy</th><th></th></tr></thead><tbody>`;
  pyqs.forEach(p=>{
    const ch = chapterById(p.chapterId); if(!ch) return;
    const acc = p.attempted? Math.round(p.correct/p.attempted*100) : 0;
    html += `<tr class="rowhover"><td><b>${ch.name}</b><div class="smallmuted">${subjectById(ch.subjectId)?.name}</div></td>
      <td class="smallmuted">${p.total}</td><td class="smallmuted">${p.attempted}</td><td class="smallmuted">${p.correct}</td><td class="smallmuted">${p.incorrect}</td><td class="smallmuted">${p.skipped}</td>
      <td><span class="pill ${acc>=70?'green':acc>=50?'amber':'red'}">${acc}%</span></td>
      <td><button class="icon-action" onclick="deletePYQ('${p.id}')">${ICONS.trash}</button></td></tr>`;
  });
  html += `</tbody></table>${pyqs.length===0?'<div class="empty">No PYQ sets tracked yet.</div>':''}</div>`;
  return html;
}
function openPYQModal(){
  showModal('Add PYQ Set', `
    <div class="field"><label>Chapter</label><select id="f_chapter">${state.chapters.map(c=>`<option value="${c.id}">${subjectById(c.subjectId)?.name} — ${c.name}</option>`).join('')}</select></div>

        const hrs = studyHoursBetween(iso,iso);
        const hasTest = state.tests.some(t=>t.date===iso);

        const hasTarget = state.chapters.some(c=>c.targetDate===iso);
        let bg = 'var(--surface2)';
        if(hrs>=6) bg='var(--accent)'; else if(hrs>=4) bg='#7C6CF6bb'; else if(hrs>=2) bg='#7C6CF677'; else if(hrs>=1) bg='#7C6CF63a';
        const isToday = iso===todayISO();
        return `<div style="aspect-ratio:1; border-radius:8px; background:${bg}; border:1px solid ${isToday?'var(--accent)':'var(--border)'}; padding:5px; font-size:10.5px; position:relative; cursor:default;" title="${hrs.toFixed(1)}h studied">
          <div style="font-family:var(--font-mono); font-weight:600; color:${hrs>=2?'#fff':'var(--ink-dim)'}">${d}</div>

            ${hasRevision?'<div style="width:5px;height:5px;border-radius:50%;background:var(--amber)"></div>':''}
            ${hasTarget?'<div style="width:5px;height:5px;border-radius:50%;background:var(--cyan)"></div>':''}

      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:4px;"></span>Test</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--amber);margin-right:4px;"></span>Revision Due</span>
      <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cyan);margin-right:4px;"></span>Chapter Target</span>

  html += `<div class="card"><div class="section-title">Study Activity Heatmap (last 12 weeks) <span class="pill blue">${currentStreak()} day streak</span></div>
    <div style="display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,13px); gap:3px; overflow-x:auto; padding-bottom:6px;">

        const iso = daysAgoISO(offset); const hrs = studyHoursBetween(iso,iso);

/* ============================= GOALS ============================= */

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='command12-backup-'+todayISO()+'.json'; a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ try{ const data = JSON.parse(reader.result); state = data; markDirty(); toast('Backup restored'); }catch(err){ toast('Invalid backup file'); } };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('This will permanently delete ALL subjects, chapters, lectures, sessions, tests, PYQs, revisions and planner data. The app will become completely blank. Continue?')) return;
  clearTimeout(saveTimer);
  state = emptyState();
  try{
    localStorage.removeItem('command12-app-data');
    localStorage.setItem('command12-app-data', JSON.stringify(state));
  }catch(e){
    console.error('Reset save failed:', e);
    toast('Reset failed — browser storage may be blocked');

}
function toast(msg){
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.getElementById('toastRoot').appendChild(el);

}

/* ============================= HABIT TRACKER ============================= */
function habitCompletionForDate(date){
  const habits = state.habits || [];
  const done = habits.filter(h => h.history && h.history[date]).length;
  return {done,total:habits.length,pct:habits.length?Math.round(done/habits.length*100):0};
}
function pageHabits(){
  const month = ui.habitMonth ?? new Date().getMonth();
  const year = ui.habitYear ?? new Date().getFullYear();
  const habits = state.habits || [];
  const days = new Date(year,month+1,0).getDate();
  let html = topbar('Habit Tracker','Track daily habits with monthly tick columns and consistency graphs',
    `<button class="btn" onclick="openHabitModal()">${ICONS.plus} Add Habit</button>`);
  html += `<div class="card" style="margin-bottom:16px;"><div class="filterbar">
    <button class="btn secondary" onclick="shiftHabitMonth(-1)">←</button>
    <div style="font-family:var(--font-display);font-weight:700;font-size:16px;min-width:170px;text-align:center;">${new Date(year,month,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</div>
    <button class="btn secondary" onclick="shiftHabitMonth(1)">→</button>
    <span class="smallmuted">${habits.length} habits</span></div>
    <div style="overflow-x:auto;"><table><thead><tr><th style="position:sticky;left:0;background:var(--surface);z-index:2;min-width:160px;">Habit</th>${Array.from({length:days},(_,i)=>{const dt=new Date(year,month,i+1);const wd=dt.toLocaleDateString('en-IN',{weekday:'short'});return `<th style="text-align:center;min-width:42px;line-height:1.15;"><div>${i+1}</div><small class="smallmuted">${wd}</small></th>`;}).join('')}<th style="text-align:center;">%</th></tr></thead><tbody>
    ${habits.map(h=>{let done=0;const cells=Array.from({length:days},(_,i)=>{const date=`${year}-${String(month+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;const checked=!!(h.history&&h.history[date]);if(checked)done++;return `<td style="text-align:center;"><input type="checkbox" ${checked?'checked':''} onchange="toggleHabit('${h.id}','${date}',this.checked)"></td>`;}).join('');const pct=days?Math.round(done/days*100):0;return `<tr><td style="position:sticky;left:0;background:var(--surface);z-index:1;"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><span style="font-weight:600;">${h.name}</span><button class="icon-action" onclick="deleteHabit('${h.id}')">${ICONS.trash}</button></div></td>${cells}<td style="text-align:center;"><span class="pill ${pct>=80?'green':pct>=50?'amber':'gray'}">${pct}%</span></td></tr>`;}).join('') || `<tr><td colspan="${days+2}" class="empty">Add your first habit to start tracking.</td></tr>`}
    </tbody></table></div></div>`;
  html += `<div class="grid g2"><div class="card"><div class="section-title">Daily Consistency · Last 30 Days</div><canvas id="chartHabitDaily" height="180"></canvas></div><div class="card"><div class="section-title">Monthly Consistency · This Year</div><canvas id="chartHabitMonthly" height="180"></canvas></div></div>`;
  html += `<div class="card" style="margin-top:16px;"><div class="section-title">Habit-wise Consistency · ${new Date(year,month,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</div><canvas id="chartHabitConsistency" height="150"></canvas></div>`;
  afterRenderHooks=()=>{drawHabitDailyChart('chartHabitDaily');drawHabitMonthlyChart('chartHabitMonthly');drawHabitConsistencyChart('chartHabitConsistency');};
  return html;
}
function shiftHabitMonth(delta){let d=new Date(ui.habitYear??new Date().getFullYear(),ui.habitMonth??new Date().getMonth(),1);d.setMonth(d.getMonth()+delta);ui.habitMonth=d.getMonth();ui.habitYear=d.getFullYear();render();}
function toggleHabit(id,date,checked){const h=(state.habits||[]).find(x=>x.id===id);if(!h)return;h.history=h.history||{};if(checked)h.history[date]=true;else delete h.history[date];markDirty();}
function deleteHabit(id){if(!confirm('Delete this habit?'))return;state.habits=(state.habits||[]).filter(h=>h.id!==id);markDirty();}
function openHabitModal(){showModal('Add Habit',`<div class="field"><label>Habit Name</label><input id="habitName" placeholder="e.g. Morning Run"></div>`,()=>{const name=document.getElementById('habitName').value.trim();if(!name)return;state.habits=state.habits||[];state.habits.push({id:uid(),name,history:{}});closeModal();markDirty();});}
function drawHabitDailyChart(canvasId){const el=document.getElementById(canvasId);if(!el)return;destroyChart(canvasId);const labels=[],data=[];for(let i=29;i>=0;i--){const d=daysAgoISO(i);labels.push(new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'}));data.push(habitCompletionForDate(d).pct);}const cc=chartColors();chartRegistry[canvasId]=new Chart(el,{type:'line',data:{labels,datasets:[{label:'Consistency %',data,borderColor:'#7C6CF6',backgroundColor:'#7C6CF622',fill:true,tension:.35,pointRadius:3}]},options:{responsive:true,plugins:{legend:{labels:{color:cc.text}}},scales:{x:{ticks:{color:cc.text,maxTicksLimit:8},grid:{display:false}},y:{min:0,max:100,ticks:{color:cc.text,callback:v=>v+'%'},grid:{color:cc.grid}}}}});}
function drawHabitMonthlyChart(canvasId){
  const el=document.getElementById(canvasId);if(!el)return;destroyChart(canvasId);
  const year=ui.habitYear??new Date().getFullYear();
  const labels=[],data=[];
  for(let m=0;m<12;m++){
    const days=new Date(year,m+1,0).getDate();let total=0,done=0;
    for(let d=1;d<=days;d++){const iso=`${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const r=habitCompletionForDate(iso);total+=r.total;done+=r.done;}
    labels.push(new Date(year,m,1).toLocaleDateString('en-IN',{month:'short'}));data.push(total?Math.round(done/total*100):0);
  }
  const cc=chartColors();chartRegistry[canvasId]=new Chart(el,{type:'line',data:{labels,datasets:[{label:'Monthly consistency %',data,borderColor:'#3FC6E0',backgroundColor:'#3FC6E022',fill:true,tension:.3,pointRadius:3}]},options:{responsive:true,plugins:{legend:{labels:{color:cc.text}}},scales:{x:{ticks:{color:cc.text},grid:{display:false}},y:{min:0,max:100,ticks:{color:cc.text,callback:v=>v+'%'},grid:{color:cc.grid}}}}});
}
function drawHabitConsistencyChart(canvasId){const el=document.getElementById(canvasId);if(!el)return;destroyChart(canvasId);const month=ui.habitMonth??new Date().getMonth(),year=ui.habitYear??new Date().getFullYear(),days=new Date(year,month+1,0).getDate(),labels=(state.habits||[]).map(h=>h.name),data=(state.habits||[]).map(h=>{let done=0;for(let i=1;i<=days;i++){const date=`${year}-${String(month+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;if(h.history&&h.history[date])done++;}return days?Math.round(done/days*100):0;});const cc=chartColors();chartRegistry[canvasId]=new Chart(el,{type:'bar',data:{labels,datasets:[{label:'Consistency %',data,backgroundColor:'#33C481',borderRadius:6}]},options:{responsive:true,plugins:{legend:{labels:{color:cc.text}}},scales:{x:{ticks:{color:cc.text},grid:{display:false}},y:{min:0,max:100,ticks:{color:cc.text,callback:v=>v+'%'},grid:{color:cc.grid}}}}});}

<script>
(function(){
  const USERS='command12-users-v2';
  const SESSION='command12-session-v2';
  const ACTIVE='command12-active-v2';
  const DEFAULT={id:'admin',name:'Administrator',pass:'admin123',role:'admin',createdAt:new Date().toISOString(),lastLogin:null};

  function users(){
    try{return JSON.parse(localStorage.getItem(USERS)||'[]')}catch(e){return []}
  }
  function saveUsers(u){localStorage.setItem(USERS,JSON.stringify(u))}
  function ensureAdmin(){
    let u=users();
    if(!u.length) saveUsers([DEFAULT]);
  }
  function msg(t){document.getElementById('c12AuthMsg').textContent=t||''}
  window.c12ShowAuth=function(which){
    document.getElementById('c12LoginForm').classList.toggle('active',which==='login');
    document.getElementById('c12SignupForm').classList.toggle('active',which==='signup');
    msg('');
  };
  window.c12Guest=function(){
    const s={id:'guest-'+Math.random().toString(36).slice(2,10),name:'Guest',role:'guest',loginAt:new Date().toISOString()};
    sessionStorage.setItem(SESSION,JSON.stringify(s));
    localStorage.setItem(ACTIVE,JSON.stringify({id:s.id,name:s.name,role:s.role,lastSeen:Date.now()}));
    document.getElementById('c12AuthOverlay').style.display='none';
    if(window.toast) toast('Continuing as Guest');
  };
  window.c12DoSignup=function(){
    const name=document.getElementById('c12SignupName').value.trim();
    const id=document.getElementById('c12SignupId').value.trim().toLowerCase();
    const pass=document.getElementById('c12SignupPass').value;
    if(!name||!id||pass.length<6){msg('Enter name, Login ID and a password of at least 6 characters.');return}
    let u=users();
    if(u.some(x=>x.id===id)){msg('This Login ID already exists.');return}
    const nu={id,name,pass,role:'user',createdAt:new Date().toISOString(),lastLogin:new Date().toISOString()};
    u.push(nu); saveUsers(u);
    const s={id,name,role:'user',loginAt:new Date().toISOString()};
    sessionStorage.setItem(SESSION,JSON.stringify(s));
    localStorage.setItem(ACTIVE,JSON.stringify({id,name,role:'user',lastSeen:Date.now()}));
    document.getElementById('c12AuthOverlay').style.display='none';
    if(window.toast) toast('Account created successfully');
  };
  window.c12DoLogin=function(){
    const id=document.getElementById('c12LoginId').value.trim().toLowerCase();
    const pass=document.getElementById('c12LoginPass').value;
    const u=users().find(x=>x.id===id && x.pass===pass);
    if(!u){msg('Invalid Login ID or Password.');return}
    u.lastLogin=new Date().toISOString();
    saveUsers(users().map(x=>x.id===u.id?u:x));
    const s={id:u.id,name:u.name,role:u.role,loginAt:new Date().toISOString()};
    sessionStorage.setItem(SESSION,JSON.stringify(s));
    localStorage.setItem(ACTIVE,JSON.stringify({id:u.id,name:u.name,role:u.role,lastSeen:Date.now()}));
    document.getElementById('c12AuthOverlay').style.display='none';
    if(window.toast) toast('Welcome, '+u.name);
  };
  window.c12Logout=function(){
    try{
      sessionStorage.removeItem('command12-session-v2');
      sessionStorage.removeItem('command12-auth-ok');
      localStorage.removeItem('command12-active-v2');
    }catch(e){}
    // Return to the login screen without reloading the whole app.
    const overlay=document.getElementById('c12AuthOverlay') || document.getElementById('authOverlay');
    if(overlay){
      overlay.style.display='flex';
      const li=document.getElementById('c12LoginId');
      const lp=document.getElementById('c12LoginPass');
      if(li) li.value='';
      if(lp) lp.value='';
      const m=document.getElementById('c12AuthMsg');
      if(m) m.textContent='You have been logged out.';
      if(window.c12ShowAuth) window.c12ShowAuth('login');
    }else{
      location.href=location.href.split('#')[0];
    }
  };
  window.c12CurrentUser=function(){try{return JSON.parse(sessionStorage.getItem(SESSION)||'null')}catch(e){return null}};
  window.c12AdminStats=function(){
    const u=users();
    const a=JSON.parse(localStorage.getItem(ACTIVE)||'null');
    const active=a && Date.now()-a.lastSeen<15*60*1000 ? 1 : 0;
    return {total:u.length,active,registered:u.filter(x=>x.role==='user').length};
  };
  window.c12ShowAdminDashboard=function(){
    if(window.c12OpenUserData){ window.c12OpenUserData(); return; }
    const me=c12CurrentUser();
    if(!me || me.role!=='admin'){alert('Admin access required.');return}
    const st=c12AdminStats();
    const u=users();
    let rows=u.map(x=>'<tr><td>'+x.name+'</td><td>'+x.id+'</td><td>'+x.role+'</td><td>'+new Date(x.createdAt).toLocaleString()+'</td><td>'+(x.lastLogin?new Date(x.lastLogin).toLocaleString():'—')+'</td></tr>').join('');
    const w=document.createElement('div');
    w.className='modal-bg';
    w.innerHTML='<div class="modal" style="width:min(900px,95vw)"><h3>Admin User Dashboard</h3>'+
      '<div><div class="c12-admin-stat"><strong>'+st.total+'</strong><span>Total Accounts</span></div>'+
      '<div class="c12-admin-stat"><strong>'+st.registered+'</strong><span>Registered Users</span></div>'+
      '<div class="c12-admin-stat"><strong>'+st.active+'</strong><span>Active on this browser</span></div></div>'+
      '<p class="smallmuted">This standalone HTML can only measure users/accounts stored in this browser. It cannot count visitors across the internet.</p>'+
      '<div style="overflow:auto"><table><thead><tr><th>Name</th><th>Login ID</th><th>Role</th><th>Created</th><th>Last Login</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="this.closest(\'.modal-bg\').remove()">Close</button></div></div>';
    document.body.appendChild(w);
  };
  window.c12AddAdminButton=function(){
    const me=c12CurrentUser();
    if(!me||me.role!=='admin')return;
    const root=document.body;
    const b=document.createElement('button');
    b.className='btn secondary';
    b.textContent='Admin Users';
    b.style.position='fixed';b.style.right='18px';b.style.bottom='18px';b.style.zIndex='5000';
    b.onclick=c12ShowAdminDashboard;
    root.appendChild(b);
  };
  ensureAdmin();
  document.addEventListener('DOMContentLoaded',function(){
    const s=c12CurrentUser();
    if(s){
      document.getElementById('c12AuthOverlay').style.display='none';
      localStorage.setItem(ACTIVE,JSON.stringify({id:s.id,name:s.name,role:s.role,lastSeen:Date.now()}));
      if(s.role==='admin') c12AddAdminButton();
    }
  });
})();
</script>


<script>
(function(){
  const USERS='command12-users-v2', LOGINS='command12-login-events-v1', ACT='command12-activity-v1';
  function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}
  function users(){return read(USERS,[])}
  function logins(){return read(LOGINS,[])}
  function activities(){return read(ACT,[])}
  function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
  function current(){try{return JSON.parse(sessionStorage.getItem('command12-session-v2')||'null')}catch(e){return null}}
  function track(){
    const u=current(); if(!u)return;
    const now=new Date().toISOString();
    const ev=logins(); ev.push({id:u.id,role:u.role,time:now}); save(LOGINS,ev.slice(-5000));
    const ac=activities().filter(x=>x.id!==u.id);
    ac.push({id:u.id,name:u.name,role:u.role,lastSeen:Date.now()}); save(ACT,ac);
  }
  window.c12TrackLogin=track;
  window.c12OpenUserData=function(){
    const me=current(); if(!me||me.role!=='admin'){alert('Admin access required.');return}
    const us=users(), ls=logins(), ac=activities(), now=Date.now();
    const active=ac.filter(x=>now-x.lastSeen<15*60*1000).length;
    const today=new Date().toISOString().slice(0,10);
    const todayLogins=ls.filter(x=>x.time.slice(0,10)===today).length;
    const registered=us.filter(x=>x.role==='user').length;
    const guests=ac.filter(x=>x.role==='guest' && now-x.lastSeen<24*60*60*1000).length;
    const rows=us.map(x=>{
      const ev=ls.filter(e=>e.id===x.id);
      const last=ev.length?ev[ev.length-1].time:x.lastLogin;
      return '<tr><td>'+x.name+'</td><td>'+x.id+'</td><td>'+x.role+'</td><td>'+ev.length+'</td><td>'+(last?new Date(last).toLocaleString():'—')+'</td></tr>';
    }).join('');
    const wrap=document.createElement('div'); wrap.className='modal-bg';
    wrap.innerHTML=`<div class="modal" style="width:min(1050px,96vw)">
      <h3>App User Data</h3>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0">
        <div class="c12-admin-stat"><strong>${us.length}</strong><span>Total Accounts</span></div>
        <div class="c12-admin-stat"><strong>${registered}</strong><span>Registered Users</span></div>
        <div class="c12-admin-stat"><strong>${active}</strong><span>Active (15 min)</span></div>
        <div class="c12-admin-stat"><strong>${ls.length}</strong><span>Total Logins</span></div>
        <div class="c12-admin-stat"><strong>${todayLogins}</strong><span>Today's Logins</span></div>
        <div class="c12-admin-stat"><strong>${guests}</strong><span>Recent Guests</span></div>
      </div>
      <p class="smallmuted">Admin-only section. In this standalone file, statistics are stored locally in this browser. A cloud backend is required for website-wide user analytics.</p>
      <div style="overflow:auto;max-height:52vh"><table><thead><tr><th>Name</th><th>Login ID</th><th>Role</th><th>Login Count</th><th>Last Login</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="this.closest('.modal-bg').remove()">Close</button></div>
    </div>`;
    document.body.appendChild(wrap);
  };
  window.c12AddUserDataButton=function(){
    if(document.getElementById('c12UserDataBtn'))return;
    const me=current(); if(!me||me.role!=='admin')return;
    const b=document.createElement('button');
    b.id='c12UserDataBtn'; b.className='btn secondary'; b.textContent='App User Data';
    b.style.position='fixed'; b.style.right='18px'; b.style.bottom='62px'; b.style.zIndex='5000';
    b.onclick=c12OpenUserData; document.body.appendChild(b);
  };
  document.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){track();c12AddUserDataButton()},200);
  });
})();
</script>

document.addEventListener('DOMContentLoaded', function(){

    try{
      const session=sessionStorage.getItem('command12-session-v2');
      const overlay=document.getElementById('c12AuthOverlay');
      if(!session && overlay) overlay.style.display='flex';
    }catch(e){}
  },100);
